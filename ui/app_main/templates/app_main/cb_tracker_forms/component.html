<form method="post" action="{% url 'app_main:codebeamer_create_item' tracker.id %}">
  {% csrf_token %}

  <div class="mb-3">
    <label class="form-label fw-semibold">Name <span class="text-danger">*</span></label>
    <input type="text" name="name" class="form-control form-control-sm" required>
  </div>

  <div class="mb-3">
    <label class="form-label fw-semibold">Type <span class="text-danger">*</span></label>
    <select name="type_name" class="form-select form-select-sm" required>
      <option value="" disabled selected>— select type —</option>
      {% for t in item_type_options %}
      <option value="{{ t.name }}">{{ t.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label fw-semibold">Description</label>
    <textarea name="description" class="form-control form-control-sm" rows="3"></textarea>
  </div>

  {% for f in tracker_fields %}
  {% if f.type == "ChoiceField" and f.options %}
  <div class="mb-3">
    <label class="form-label fw-semibold">{{ f.name }}</label>
    <select name="field_{{ f.id }}" class="form-select form-select-sm" {% if f.multiple %}multiple{% endif %}>
      {% if not f.multiple %}<option value="">— select —</option>{% endif %}
      {% for opt in f.options %}
      <option value="{{ opt.id }}">{{ opt.name }}</option>
      {% endfor %}
    </select>
  </div>
  {% elif f.type == "TextField" or f.type == "WikiTextField" %}
  <div class="mb-3">
    <label class="form-label fw-semibold">{{ f.name }}</label>
    <input type="text" name="field_{{ f.id }}" class="form-control form-control-sm">
  </div>
  {% elif f.type == "IntegerField" %}
  <div class="mb-3">
    <label class="form-label fw-semibold">{{ f.name }}</label>
    <input type="number" name="field_{{ f.id }}" class="form-control form-control-sm">
  </div>
  {% elif f.type == "DateField" %}
  <div class="mb-3">
    <label class="form-label fw-semibold">{{ f.name }}</label>
    <input type="date" name="field_{{ f.id }}" class="form-control form-control-sm">
  </div>
  {% endif %}
  {% endfor %}

  <button type="submit" class="btn btn-primary btn-sm d-inline-flex align-items-center gap-1">
    <span class="material-icons" style="font-size:1rem;">add</span>
    Create Item
  </button>
</form>
